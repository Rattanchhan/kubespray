# This inventory describe a HA typology with stacked etcd (== same nodes as control plane)
# and 3 worker nodes
# See https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
# for tips on building your # inventory

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/ubuntu/.ssh/id_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

# Configure 'ip' variable to bind kubernetes services on a different ip than the default iface
# We should set etcd_member_name for etcd cluster. The node that are not etcd members do not need to set the value,
# or can set the empty string value.
[kube_control_plane]
master-1 ansible_host=18.204.23.185 ip=172.31.6.64 access_ip=172.31.6.64 instance_id=i-0a23cf07eb5ef8b0e machine_size=large
master-2 ansible_host=98.92.127.132 ip=172.31.12.230 access_ip=172.31.12.230 instance_id=i-02a3ee22db1c22605 machine_size=large
instance1 ansible_host=52.0.60.98 ip=172.31.29.155 access_ip=172.31.29.155

# node1 ansible_host=95.54.0.12  # ip=10.3.0.1 etcd_member_name=etcd1
# node2 ansible_host=95.54.0.13  # ip=10.3.0.2 etcd_member_name=etcd2
# node3 ansible_host=95.54.0.14  # ip=10.3.0.3 etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[kube_node]
worker-2 ansible_host=3.90.67.91 ip=172.31.90.138 access_ip=172.31.90.138 instance_id=i-09370de179b6459a7 machine_size=medium
worker-1 ansible_host=3.85.159.31 ip=172.31.90.143 access_ip=172.31.90.143 instance_id=i-0af095e7b1907e26f machine_size=medium
# node4 ansible_host=95.54.0.15  # ip=10.3.0.4
# node5 ansible_host=95.54.0.16  # ip=10.3.0.5
# node6 ansible_host=95.54.0.17  # ip=10.3.0.6

[k8s_cluster:children]
kube_control_plane
kube_node
